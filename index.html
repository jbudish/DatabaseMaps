<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Property Map</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a3a5c;
    --navy-soft: #3d5a78;
    --ink: #2b3542;
    --ink-soft: #6b7688;
    --line: #dfe3e8;
    --panel: #f7f8fa;
    --gold: #c9962e;
    --gold-soft: #f6ecd8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: 'Inter', -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; height: 100%; }

  #sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }

  #filters-properties {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .filter-stack {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #page-switcher {
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--navy);
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    letter-spacing: -0.01em;
  }

  #reset-btn {
    align-self: flex-start;
    font-size: 10.5px;
    color: var(--navy);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  #reset-btn:hover { text-decoration: underline; }

  input[type="text"], input[type="number"] {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--ink);
    outline: none;
    width: 100%;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

  .range-row { display: flex; gap: 6px; align-items: center; }
  .range-row span { color: var(--ink-soft); font-size: 12px; }

  /* ---------- MULTI-SELECT WITH SEARCH (shared by filters + exclude list) ---------- */
  .ms { position: relative; }
  .ms-button {
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .ms-button.has-value { color: var(--navy); font-weight: 700; border-color: var(--gold); }
  .ms-panel {
    display: none;
    position: absolute;
    z-index: 30;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(26,58,92,0.14);
    max-height: 280px;
    flex-direction: column;
  }
  .ms.open .ms-panel { display: flex; }
  .ms-search {
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 8px 8px 0 0;
    padding: 9px 10px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .ms-list { overflow-y: auto; padding: 4px 0; }
  .ms-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .ms-option:hover { background: var(--gold-soft); }
  .ms-option input { width: auto; accent-color: var(--navy); }
  .ms-footer {
    border-top: 1px solid var(--line);
    padding: 7px 10px;
    font-size: 11.5px;
    color: var(--gold);
    cursor: pointer;
    font-weight: 700;
  }

  /* ---------- MAP + STATS ---------- */
  #map-wrap { flex: 1; position: relative; display: flex; }
  #map { flex: 1; position: relative; }
  #stats {
    width: 253px;
    flex-shrink: 0;
    background: #fff;
    border-left: 1px solid var(--line);
    padding: 22px 18px;
    overflow-y: auto;
  }
  .stat-block { margin-bottom: 20px; }
  .stat-label {
    font-family: 'Manrope', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .stat-value {
    font-family: 'Manrope', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    margin-top: 3px;
    letter-spacing: -0.01em;
  }
  .rank-header {
    display: flex;
    justify-content: flex-end;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .rank-list { margin-top: 4px; }
  .rank-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--navy);
    padding: 4px 0;
    border-bottom: 1px solid var(--line);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row .n { color: var(--ink-soft); font-weight: 500; flex-shrink: 0; }

  #loading {
    position: absolute; inset: 0; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-soft); z-index: 5;
  }

  /* ---------- POPUP ---------- */
  .maplibregl-popup-content {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(26,58,92,0.22);
    min-width: 220px;
  }
  .popup-accent { height: 4px; background: var(--gold); }
  .popup-body { padding: 14px 16px 12px; }
  .popup-name {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--navy);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .popup-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    border-bottom: 1px solid var(--line);
  }
  .popup-row:last-of-type { border-bottom: none; }
  .popup-row .k { color: var(--ink-soft); font-size: 12px; }
  .popup-row .v { font-weight: 600; text-align: right; color: var(--ink); font-size: 12.5px; }
  .popup-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
    text-decoration: none;
  }
  .popup-link:hover { text-decoration: underline; }

  .coming-soon {
    padding: 30px 10px; text-align: center; color: var(--ink-soft); font-size: 13.5px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <select id="page-switcher">
      <option value="properties">Properties</option>
      <option value="development">Development</option>
      <option value="sales">Sales</option>
    </select>

    <div id="filters-properties">
      <div class="filter-stack">
        <div id="ms-type" class="ms-slot" data-field="type" data-placeholder="Property type"></div>
        <div id="ms-submarket" class="ms-slot" data-field="submarket" data-placeholder="Submarket"></div>
        <div id="ms-city" class="ms-slot" data-field="city" data-placeholder="City"></div>

        <div class="range-row">
          <input type="number" id="year-min" placeholder="Year Built" />
          <span>to</span>
          <input type="number" id="year-max" placeholder="Year Built" />
        </div>

        <div class="range-row">
          <input type="number" id="units-min" placeholder="Units" />
          <span>to</span>
          <input type="number" id="units-max" placeholder="Units" />
        </div>

        <div id="ms-owner" class="ms-slot" data-field="ownerName" data-placeholder="Owner"></div>
      </div>

      <div id="ms-exclude" class="ms-slot"></div>

      <button id="reset-btn">Clear Filters</button>
    </div>

    <div id="filters-development" style="display:none;">
      <div class="coming-soon">Development page — coming in the next phase.</div>
    </div>

    <div id="filters-sales" style="display:none;">
      <div class="coming-soon">Sales page — coming in the next phase.</div>
    </div>
  </div>

  <div id="map-wrap">
    <div id="map">
      <div id="loading">Loading properties…</div>
    </div>
    <div id="stats">
      <div class="stat-block">
        <div class="stat-label">Properties</div>
        <div class="stat-value" id="stat-count">—</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Units</div>
        <div class="stat-value" id="stat-units">—</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Avg year built</div>
        <div class="stat-value" id="stat-year">—</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Largest owners</div>
        <div class="rank-header">Units Filtered</div>
        <div class="rank-list" id="stat-owners"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
let allProperties = [];
let companyById = {};
let excludedIds = new Set(); // session-only manual exclusions; checked = excluded
const DEFAULT_EXCLUDED_OWNER = "Condos / Coops";

/* =========================================================
   LOAD
   ========================================================= */
Promise.all([
  fetch("data/properties.json").then((r) => r.json()),
  fetch("data/companies.json").then((r) => r.json())
]).then(([props, companies]) => {
  companyById = Object.fromEntries(companies.map((c) => [c.id, c.name]));
  allProperties = props.map((p) => ({
    ...p,
    ownerName: companyById[p.ownerId] || "",
    developerName: companyById[p.developerId] || ""
  }));

  document.getElementById("loading").style.display = "none";
  initMap();
});

/* =========================================================
   MULTI-SELECT WITH SEARCH (reusable — used for filters + exclude list)
   ========================================================= */
function buildMultiSelect(containerEl, { placeholder, getValues, getSelectedInitial, onChange }) {
  containerEl.classList.add("ms");
  containerEl.innerHTML = `
    <button type="button" class="ms-button">${placeholder}</button>
    <div class="ms-panel">
      <input type="text" class="ms-search" placeholder="Search…" />
      <div class="ms-list"></div>
      <div class="ms-footer">Clear</div>
    </div>
  `;

  const btn = containerEl.querySelector(".ms-button");
  const search = containerEl.querySelector(".ms-search");
  const list = containerEl.querySelector(".ms-list");
  const footer = containerEl.querySelector(".ms-footer");

  let selected = getSelectedInitial ? getSelectedInitial() : new Set();

  function render() {
    const term = search.value.trim().toLowerCase();
    const values = getValues().filter((v) => v.toLowerCase().includes(term));
    list.innerHTML = values
      .map(
        (v) => `
      <label class="ms-option">
        <input type="checkbox" value="${escapeAttr(v)}" ${selected.has(v) ? "checked" : ""} />
        <span>${escapeHTML(v)}</span>
      </label>`
      )
      .join("");

    btn.textContent =
      selected.size === 0 ? placeholder : selected.size === 1 ? [...selected][0] : `${placeholder} (${selected.size})`;
    btn.classList.toggle("has-value", selected.size > 0);

    list.querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.addEventListener("change", () => {
        if (cb.checked) selected.add(cb.value);
        else selected.delete(cb.value);
        render();
        onChange(selected);
      });
    });
  }

  btn.addEventListener("click", () => {
    document.querySelectorAll(".ms.open").forEach((el) => {
      if (el !== containerEl) el.classList.remove("open");
    });
    containerEl.classList.toggle("open");
    if (containerEl.classList.contains("open")) render();
  });

  search.addEventListener("input", render);
  footer.addEventListener("click", () => {
    selected = new Set();
    render();
    onChange(selected);
  });

  document.addEventListener("click", (e) => {
    if (!containerEl.contains(e.target)) containerEl.classList.remove("open");
  });

  return {
    getSelected: () => selected,
    setSelected: (s) => {
      selected = s;
      render();
    },
    reset: () => {
      selected = new Set();
      render();
    },
    refresh: render
  };
}

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHTML(str).replace(/"/g, "&quot;");
}
function normalizeUrl(url) {
  if (!url) return "#";
  return /^https?:\/\//i.test(url) ? url : `https://${url}`;
}

/* =========================================================
   MAP
   ========================================================= */
let map, msType, msSubmarket, msCity, msOwner, msExclude;

const UNIT_SIZE_EXPR = [
  "step", ["get", "units"],
  5,
  25, 6,
  50, 7,
  100, 8.5,
  200, 10
];

const YEAR_COLOR_EXPR = [
  "step", ["get", "yearBuilt"],
  "#800000",
  1930, "#66001a",
  1950, "#4d0033",
  1970, "#33004d",
  1990, "#1a0066",
  2010, "#000080"
];

function initMap() {
  map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [-93.2, 44.9],
    zoom: 8
  });
  map.addControl(new maplibregl.NavigationControl(), "top-right");

  map.on("load", () => {
    map.addSource("properties", {
      type: "geojson",
      data: toGeoJSON(allProperties),
      cluster: true,
      clusterMaxZoom: 11,
      clusterRadius: 25,
      clusterProperties: {
        sum_units: ["+", ["get", "units"]]
      }
    });

    map.addLayer({
      id: "clusters",
      type: "circle",
      source: "properties",
      filter: ["has", "point_count"],
      paint: {
        "circle-color": "#4d0033",
        "circle-radius": [
          "interpolate", ["linear"], ["get", "sum_units"],
          0, 12, 200, 17, 1000, 23, 5000, 30
        ],
        "circle-stroke-width": 2,
        "circle-stroke-color": "#ffffff"
      }
    });

    map.addLayer({
      id: "cluster-count",
      type: "symbol",
      source: "properties",
      filter: ["has", "point_count"],
      layout: { "text-field": ["get", "point_count_abbreviated"], "text-font": ["Noto Sans Bold"], "text-size": 12 },
      paint: { "text-color": "#ffffff" }
    });

    map.addLayer({
      id: "unclustered-point",
      type: "circle",
      source: "properties",
      filter: ["!", ["has", "point_count"]],
      paint: {
        "circle-color": YEAR_COLOR_EXPR,
        "circle-radius": UNIT_SIZE_EXPR,
        "circle-stroke-width": 2,
        "circle-stroke-color": "#ffffff"
      }
    });

    map.on("click", "clusters", (e) => {
      const f = map.queryRenderedFeatures(e.point, { layers: ["clusters"] });
      map.getSource("properties").getClusterExpansionZoom(f[0].properties.cluster_id, (err, zoom) => {
        if (err) return;
        map.easeTo({ center: f[0].geometry.coordinates, zoom });
      });
    });

    map.on("click", "unclustered-point", (e) => {
      const p = e.features[0].properties;
      const isMultifamily = p.type === "Multifamily";

      const rows = [
        ["Address", p.address],
        ["City", p.city],
        ["Submarket", p.submarket],
        ["Owner", p.ownerName],
        ["Year built", p.yearBuilt],
        isMultifamily ? ["Units", p.units] : ["Square feet", p.squareFeet]
      ]
        .map(
          ([k, v]) => `<div class="popup-row"><span class="k">${escapeHTML(k)}</span><span class="v">${escapeHTML(
            String(v || "—")
          )}</span></div>`
        )
        .join("");
      const link = p.yardiLink
        ? `<a class="popup-link" href="${escapeAttr(normalizeUrl(p.yardiLink))}" target="_blank" rel="noopener">View in Yardi →</a>`
        : "";
      new maplibregl.Popup({ offset: 10 })
        .setLngLat(e.features[0].geometry.coordinates.slice())
        .setHTML(`
          <div class="popup-accent"></div>
          <div class="popup-body">
            <div class="popup-name">${escapeHTML(p.name || "Unnamed property")}</div>
            ${rows}
            ${link}
          </div>
        `)
        .addTo(map);
    });

    ["clusters", "unclustered-point"].forEach((l) => {
      map.on("mouseenter", l, () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", l, () => (map.getCanvas().style.cursor = ""));
    });

    setupFilterUI();
    applyAll();
  });
}

function toGeoJSON(props) {
  return {
    type: "FeatureCollection",
    features: props.map((p) => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [p.lng, p.lat] },
      properties: {
        id: p.id, name: p.name, address: p.address, city: p.city, submarket: p.submarket,
        ownerName: p.ownerName, yearBuilt: p.yearBuilt, units: p.units, yardiLink: p.yardiLink,
        type: p.type, squareFeet: p.squareFeet
      }
    }))
  };
}

/* =========================================================
   FILTER UI SETUP
   ========================================================= */
function setupFilterUI() {
  msType = buildMultiSelect(document.getElementById("ms-type"), {
    placeholder: "Property type",
    getValues: () => currentFacetValues("type"),
    getSelectedInitial: () => new Set(["Multifamily"]),
    onChange: applyAll
  });
  msSubmarket = buildMultiSelect(document.getElementById("ms-submarket"), {
    placeholder: "Submarket",
    getValues: () => currentFacetValues("submarket"),
    onChange: applyAll
  });
  msCity = buildMultiSelect(document.getElementById("ms-city"), {
    placeholder: "City",
    getValues: () => currentFacetValues("city"),
    onChange: applyAll
  });
  msOwner = buildMultiSelect(document.getElementById("ms-owner"), {
    placeholder: "Owner",
    getValues: () => currentFacetValues("ownerName"),
    onChange: applyAll
  });

  msExclude = buildMultiSelect(document.getElementById("ms-exclude"), {
    placeholder: "Exclude properties",
    getValues: excludeListNames,
    getSelectedInitial: defaultExcludedNames,
    onChange: (selectedNames) => {
      excludedIds = idsForNames(selectedNames);
      applyAll();
    }
  });
  excludedIds = idsForNames(msExclude.getSelected());

  ["year-min", "year-max", "units-min", "units-max"].forEach((id) =>
    document.getElementById(id).addEventListener("input", applyAll)
  );

  document.getElementById("reset-btn").addEventListener("click", () => {
    msType.setSelected(new Set(["Multifamily"]));
    [msSubmarket, msCity, msOwner].forEach((ms) => ms.reset());
    ["year-min", "year-max", "units-min", "units-max"].forEach((id) => (document.getElementById(id).value = ""));
    msExclude.setSelected(defaultExcludedNames());
    excludedIds = idsForNames(msExclude.getSelected());
    applyAll();
  });
}

function currentFacetValues(field) {
  return [...new Set(allProperties.map((p) => p[field]).filter(Boolean))].sort();
}

function getFilterState() {
  return {
    type: msType ? msType.getSelected() : new Set(),
    submarket: msSubmarket ? msSubmarket.getSelected() : new Set(),
    city: msCity ? msCity.getSelected() : new Set(),
    owner: msOwner ? msOwner.getSelected() : new Set(),
    yearMin: numOrNull("year-min"),
    yearMax: numOrNull("year-max"),
    unitsMin: numOrNull("units-min"),
    unitsMax: numOrNull("units-max")
  };
}
function numOrNull(id) {
  const v = document.getElementById(id).value;
  return v ? parseInt(v, 10) : null;
}

function matchesFacetFilters(p, f) {
  if (f.type.size && !f.type.has(p.type)) return false;
  if (f.submarket.size && !f.submarket.has(p.submarket)) return false;
  if (f.city.size && !f.city.has(p.city)) return false;
  if (f.owner.size && !f.owner.has(p.ownerName)) return false;
  if (f.yearMin !== null && (!p.yearBuilt || p.yearBuilt < f.yearMin)) return false;
  if (f.yearMax !== null && (!p.yearBuilt || p.yearBuilt > f.yearMax)) return false;
  if (f.unitsMin !== null && (!p.units || p.units < f.unitsMin)) return false;
  if (f.unitsMax !== null && (!p.units || p.units > f.unitsMax)) return false;
  return true;
}

function currentInViewProperties() {
  const state = getFilterState();
  return allProperties.filter((p) => matchesFacetFilters(p, state));
}

// Condos / Coops (an Owner value) sorted to the top, everything else alphabetical below.
function excludeListNames() {
  const props = currentInViewProperties().filter((p) => p.name);
  const condos = [...new Set(props.filter((p) => p.ownerName === DEFAULT_EXCLUDED_OWNER).map((p) => p.name))].sort();
  const rest = [...new Set(props.filter((p) => p.ownerName !== DEFAULT_EXCLUDED_OWNER).map((p) => p.name))].sort();
  return [...condos, ...rest];
}

function defaultExcludedNames() {
  return new Set(allProperties.filter((p) => p.ownerName === DEFAULT_EXCLUDED_OWNER && p.name).map((p) => p.name));
}

function idsForNames(names) {
  const map = nameToIdMap(allProperties);
  const ids = new Set();
  names.forEach((name) => (map[name] || []).forEach((id) => ids.add(id)));
  return ids;
}

function nameToIdMap(props) {
  const map = {};
  props.forEach((p) => {
    if (!p.name) return;
    (map[p.name] = map[p.name] || []).push(p.id);
  });
  return map;
}

/* =========================================================
   APPLY: filter map + stats + exclude list
   ========================================================= */
function applyAll() {
  const state = getFilterState();
  const inView = allProperties.filter((p) => matchesFacetFilters(p, state));
  const shown = inView.filter((p) => !excludedIds.has(p.id));

  map.getSource("properties").setData(toGeoJSON(shown));
  updateStats(shown);
  if (msExclude) msExclude.refresh();
}

function updateStats(filtered) {
  document.getElementById("stat-count").textContent = filtered.length.toLocaleString();
  const totalUnits = filtered.reduce((sum, p) => sum + (p.units || 0), 0);
  document.getElementById("stat-units").textContent = totalUnits.toLocaleString();

  const yearsKnown = filtered.filter((p) => p.yearBuilt);
  const avgYear = yearsKnown.length
    ? Math.round(yearsKnown.reduce((s, p) => s + p.yearBuilt, 0) / yearsKnown.length)
    : "—";
  document.getElementById("stat-year").textContent = avgYear;

  const ownerUnits = {};
  filtered.forEach((p) => {
    if (!p.ownerName) return;
    ownerUnits[p.ownerName] = (ownerUnits[p.ownerName] || 0) + (p.units || 0);
  });
  const topOwners = Object.entries(ownerUnits).sort((a, b) => b[1] - a[1]).slice(0, 10);
  document.getElementById("stat-owners").innerHTML = topOwners
    .map(([name, units]) => `<div class="rank-row"><span>${escapeHTML(name)}</span><span class="n">${units.toLocaleString()}</span></div>`)
    .join("");
}

/* =========================================================
   PAGE SWITCHER
   ========================================================= */
document.getElementById("page-switcher").addEventListener("change", (e) => {
  const page = e.target.value;
  document.getElementById("filters-properties").style.display = page === "properties" ? "block" : "none";
  document.getElementById("filters-development").style.display = page === "development" ? "block" : "none";
  document.getElementById("filters-sales").style.display = page === "sales" ? "block" : "none";
});
</script>

</body>
</html>
