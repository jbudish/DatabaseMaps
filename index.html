<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Property Map</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a3a5c;
    --navy-soft: #3d5a78;
    --ink: #2b3542;
    --ink-soft: #6b7688;
    --line: #dfe3e8;
    --panel: #f7f8fa;
    --gold: #c9962e;
    --gold-soft: #f6ecd8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: 'Inter', -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; height: 100%; }

  #sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }

  #filters-properties {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .filter-stack {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #page-switcher {
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--navy);
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    letter-spacing: -0.01em;
  }

  #reset-btn {
    align-self: flex-start;
    font-size: 10.5px;
    color: var(--navy);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  #reset-btn:hover { text-decoration: underline; }

  input[type="text"], input[type="number"] {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--ink);
    outline: none;
    width: 100%;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

  .range-row { display: flex; gap: 6px; align-items: center; }
  .range-row span { color: var(--ink-soft); font-size: 12px; }

  /* ---------- MULTI-SELECT WITH SEARCH (shared by filters + exclude list) ---------- */
  .ms { position: relative; }
  .ms-button {
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .ms-button.has-value { color: var(--navy); font-weight: 700; border-color: var(--gold); }
  .ms-panel {
    display: none;
    position: absolute;
    z-index: 30;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(26,58,92,0.14);
    max-height: 280px;
    flex-direction: column;
  }
  .ms.open .ms-panel { display: flex; }
  .ms-search {
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 8px 8px 0 0;
    padding: 9px 10px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .ms-list { overflow-y: auto; padding: 4px 0; }
  .ms-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .ms-option:hover { background: var(--gold-soft); }
  .ms-option input[type="checkbox"], .ms-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .ms-option.selected {
    background: var(--navy);
    color: #fff;
  }
  .ms-option.selected:hover { background: var(--navy); }
  .ms-footer {
    border-top: 1px solid var(--line);
    padding: 7px 10px;
    font-size: 11.5px;
    color: var(--gold);
    cursor: pointer;
    font-weight: 700;
  }

  /* ---------- MAP + STATS ---------- */
  #map-wrap { flex: 1; position: relative; display: flex; }
  #map { flex: 1; position: relative; }
  #stats {
    width: 253px;
    flex-shrink: 0;
    background: #fff;
    border-left: 1px solid var(--line);
    padding: 22px 18px;
    overflow-y: auto;
  }
  .stat-block { margin-bottom: 20px; }
  .stat-label {
    font-family: 'Manrope', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .stat-value {
    font-family: 'Manrope', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    margin-top: 3px;
    letter-spacing: -0.01em;
  }
  .rank-header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .rank-list { margin-top: 4px; }
  .rank-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--navy);
    padding: 4px 0;
    border-bottom: 1px solid var(--line);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .rank-row .n { color: var(--navy); font-weight: 500; flex-shrink: 0; }

  #loading {
    position: absolute; inset: 0; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-soft); z-index: 5;
  }

  /* ---------- POPUP ---------- */
  .maplibregl-popup-content {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(26,58,92,0.22);
    min-width: 220px;
  }
  .popup-accent { height: 4px; background: var(--gold); }
  .popup-body { padding: 14px 16px 12px; }
  .popup-name {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--navy);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .popup-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    border-bottom: 1px solid var(--line);
  }
  .popup-row:last-of-type { border-bottom: none; }
  .popup-row .k { color: var(--ink-soft); font-size: 12px; }
  .popup-row .v { font-weight: 600; text-align: right; color: var(--ink); font-size: 12.5px; }
  .popup-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
    text-decoration: none;
  }
  .popup-link:hover { text-decoration: underline; }

  #version-badge {
    position: fixed;
    bottom: 6px;
    left: 6px;
    z-index: 999;
    font-family: monospace;
    font-size: 11px;
    color: #fff;
    background: rgba(26, 58, 92, 0.75);
    padding: 2px 7px;
    border-radius: 4px;
    pointer-events: none;
  }

  #dev-legend {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 4px;
  }
  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .coming-soon {
    padding: 30px 10px; text-align: center; color: var(--ink-soft); font-size: 13.5px;
  }
</style>
</head>
<body>

<div id="version-badge">v4</div>

<div id="app">
  <div id="sidebar">
    <select id="page-switcher">
      <option value="properties">Properties</option>
      <option value="development">Development</option>
      <option value="sales">Sales</option>
    </select>

    <div id="filters-properties">
      <div class="filter-stack">
        <div id="ms-type" class="ms-slot" data-field="type" data-placeholder="Property type"></div>
        <div id="ms-submarket" class="ms-slot" data-field="submarket" data-placeholder="Submarket"></div>
        <div id="ms-city" class="ms-slot" data-field="city" data-placeholder="City"></div>

        <div class="range-row">
          <input type="number" id="year-min" placeholder="Year Built" />
          <span>to</span>
          <input type="number" id="year-max" placeholder="Year Built" />
        </div>

        <div class="range-row">
          <input type="number" id="units-min" placeholder="Units" />
          <span>to</span>
          <input type="number" id="units-max" placeholder="Units" />
        </div>

        <div id="ms-owner" class="ms-slot" data-field="ownerName" data-placeholder="Owner"></div>
        <div id="ms-exclude" class="ms-slot"></div>
        <div id="basemap-toggle" class="ms-slot"></div>
      </div>

      <button id="reset-btn" class="page-reset-btn">Reset</button>
    </div>

    <div id="filters-development" style="display:none;">
      <div class="filter-stack">
        <div id="dev-ms-type" class="ms-slot" data-field="type" data-placeholder="Property type"></div>
        <div id="dev-ms-submarket" class="ms-slot" data-field="submarket" data-placeholder="Submarket"></div>
        <div id="dev-ms-city" class="ms-slot" data-field="city" data-placeholder="City"></div>

        <div class="range-row">
          <input type="number" id="dev-year-min" placeholder="Year Built" />
          <span>to</span>
          <input type="number" id="dev-year-max" placeholder="Year Built" />
        </div>

        <div class="range-row">
          <input type="number" id="dev-units-min" placeholder="Units" />
          <span>to</span>
          <input type="number" id="dev-units-max" placeholder="Units" />
        </div>

        <div id="dev-ms-developer" class="ms-slot" data-field="developerName" data-placeholder="Developer"></div>
        <div id="dev-ms-exclude" class="ms-slot"></div>
      </div>

      <button id="dev-reset-btn" class="page-reset-btn">Reset</button>
    </div>

    <div id="filters-sales" style="display:none;">
      <div class="coming-soon">Sales page — coming in the next phase.</div>
    </div>
  </div>

  <div id="map-wrap">
    <div id="map">
      <div id="loading">Loading properties…</div>
    </div>
    <div id="stats">
      <div id="stats-properties">
        <div class="stat-block">
          <div class="stat-label">Properties</div>
          <div class="stat-value" id="stat-count">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Units</div>
          <div class="stat-value" id="stat-units">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Avg year built</div>
          <div class="stat-value" id="stat-year">—</div>
        </div>
        <div class="stat-block">
          <div class="rank-header-row">
            <div class="stat-label">Largest owners</div>
            <div class="stat-label">Units Filtered</div>
          </div>
          <div class="rank-list" id="stat-owners"></div>
        </div>
      </div>

      <div id="stats-development" style="display:none;">
        <div class="stat-block">
          <div class="stat-label">Properties</div>
          <div class="stat-value" id="dev-stat-count">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Units</div>
          <div class="stat-value" id="dev-stat-units">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Avg SF</div>
          <div class="stat-value" id="dev-stat-sf">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Avg in-place rent</div>
          <div class="stat-value" id="dev-stat-rent">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Avg rent PSF</div>
          <div class="stat-value" id="dev-stat-rentpsf">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Avg occupancy</div>
          <div class="stat-value" id="dev-stat-occupancy">—</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">Rent PSF legend</div>
          <div id="dev-legend"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
let allProperties = [];
let companyById = {};
let excludedIds = new Set(); // Properties page: session-only manual exclusions; checked = excluded
let excludedIdsDev = new Set(); // Development page: its own separate exclusion set
const DEFAULT_EXCLUDED_OWNER = "Condos / Coops";

let currentPage = "properties";
let msDevType, msDevSubmarket, msDevCity, msDevDeveloper, msDevExclude;

const RAINBOW7 = ["#c0392b", "#e08e4f", "#d4b106", "#1f8a4c", "#1c9e8e", "#1c5fa8", "#6b3fa0"];

/* =========================================================
   LOAD
   ========================================================= */
Promise.all([
  fetch("data/properties.json").then((r) => r.json()),
  fetch("data/companies.json").then((r) => r.json())
]).then(([props, companies]) => {
  companyById = Object.fromEntries(companies.map((c) => [c.id, c.name]));
  allProperties = props.map((p) => ({
    ...p,
    ownerName: companyById[p.ownerId] || "",
    developerName: companyById[p.developerId] || ""
  }));

  document.getElementById("loading").style.display = "none";
  initMap();
});

/* =========================================================
   MULTI-SELECT WITH SEARCH (reusable — used for filters + exclude list)
   ========================================================= */
function buildMultiSelect(containerEl, { placeholder, getValues, getSelectedInitial, onChange }) {
  containerEl.classList.add("ms");
  containerEl.innerHTML = `
    <button type="button" class="ms-button">${placeholder}</button>
    <div class="ms-panel">
      <input type="text" class="ms-search" placeholder="Search…" />
      <div class="ms-list"></div>
      <div class="ms-footer">Clear</div>
    </div>
  `;

  const btn = containerEl.querySelector(".ms-button");
  const search = containerEl.querySelector(".ms-search");
  const list = containerEl.querySelector(".ms-list");
  const footer = containerEl.querySelector(".ms-footer");

  let selected = getSelectedInitial ? getSelectedInitial() : new Set();

  function render() {
    const term = search.value.trim().toLowerCase();
    const values = getValues().filter((v) => v.toLowerCase().includes(term));
    list.innerHTML = values
      .map(
        (v) => `
      <label class="ms-option ${selected.has(v) ? "selected" : ""}">
        <input type="checkbox" value="${escapeAttr(v)}" ${selected.has(v) ? "checked" : ""} />
        <span>${escapeHTML(v)}</span>
      </label>`
      )
      .join("");

    btn.textContent =
      selected.size === 0 ? placeholder : selected.size === 1 ? [...selected][0] : `${placeholder} (${selected.size})`;
    btn.classList.toggle("has-value", selected.size > 0);

    list.querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.addEventListener("change", () => {
        if (cb.checked) selected.add(cb.value);
        else selected.delete(cb.value);
        render();
        onChange(selected);
      });
    });
  }

  btn.addEventListener("click", () => {
    document.querySelectorAll(".ms.open").forEach((el) => {
      if (el !== containerEl) el.classList.remove("open");
    });
    containerEl.classList.toggle("open");
    if (containerEl.classList.contains("open")) render();
  });

  search.addEventListener("input", render);
  footer.addEventListener("click", () => {
    selected = new Set();
    render();
    onChange(selected);
  });

  document.addEventListener("click", (e) => {
    if (!containerEl.contains(e.target)) containerEl.classList.remove("open");
  });

  render(); // reflect initial selection (button text + checkbox state) without requiring a first open

  return {
    getSelected: () => selected,
    setSelected: (s) => {
      selected = s;
      render();
    },
    reset: () => {
      selected = new Set();
      render();
    },
    refresh: render
  };
}

// Single-choice variant of the dropdown, reusing the exact same classes as
// buildMultiSelect so it's visually identical to the other filters (no search box,
// no "Clear" footer, one option always active).
function buildSingleSelect(containerEl, { options, initial, onChange }) {
  containerEl.classList.add("ms");
  containerEl.innerHTML = `
    <button type="button" class="ms-button has-value"></button>
    <div class="ms-panel">
      <div class="ms-list"></div>
    </div>
  `;

  const btn = containerEl.querySelector(".ms-button");
  const list = containerEl.querySelector(".ms-list");

  let current = initial;

  function render() {
    const chosen = options.find((o) => o.value === current);
    btn.textContent = chosen ? chosen.label : "";

    list.innerHTML = options
      .map(
        (o) => `
      <label class="ms-option ${o.value === current ? "selected" : ""}">
        <input type="radio" name="${containerEl.id}-radio" value="${escapeAttr(o.value)}" ${
          o.value === current ? "checked" : ""
        } />
        <span>${escapeHTML(o.label)}</span>
      </label>`
      )
      .join("");

    list.querySelectorAll("input[type=radio]").forEach((r) => {
      r.addEventListener("change", () => {
        current = r.value;
        render();
        containerEl.classList.remove("open");
        onChange(current);
      });
    });
  }

  btn.addEventListener("click", () => {
    document.querySelectorAll(".ms.open").forEach((el) => {
      if (el !== containerEl) el.classList.remove("open");
    });
    containerEl.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!containerEl.contains(e.target)) containerEl.classList.remove("open");
  });

  render();
}

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHTML(str).replace(/"/g, "&quot;");
}
function normalizeUrl(url) {
  if (!url) return "#";
  return /^https?:\/\//i.test(url) ? url : `https://${url}`;
}

/* =========================================================
   MAP
   ========================================================= */
let map, msType, msSubmarket, msCity, msOwner, msExclude;
let mapBounds = null;

const RASTER_BASEMAPS = {
  map: {
    tiles: ["https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"],
    attribution: "© OpenStreetMap contributors © CARTO"
  },
  grey: {
    tiles: ["https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png"],
    attribution: "© OpenStreetMap contributors © CARTO"
  },
  aerial: {
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
    attribution: "Imagery © Esri, Maxar, Earthstar Geographics"
  }
};

const UNIT_SIZE_EXPR = [
  "step", ["coalesce", ["get", "units"], 0],
  5,
  25, 7.5,
  50, 10,
  100, 12.5,
  200, 15
];

const YEAR_COLOR_EXPR = [
  "step", ["coalesce", ["get", "yearBuilt"], 0],
  "#800000",
  1930, "#66001a",
  1950, "#4d0033",
  1970, "#33004d",
  1990, "#1a0066",
  2010, "#000080"
];

function initMap() {
  map = new maplibregl.Map({
    container: "map",
    // A single, permanent minimal style. We never call setStyle() again after this —
    // basemaps are swapped by replacing just the "basemap" raster layer beneath our
    // property layers, which are added once and never touched again. This avoids a
    // MapLibre quirk where repeatedly tearing down/rebuilding the whole style via
    // setStyle() could silently corrupt the GeoJSON clustering engine.
    style: {
      version: 8,
      glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
      sources: {},
      layers: []
    },
    center: [-93.2, 44.9],
    zoom: 8
  });
  map.addControl(new maplibregl.NavigationControl(), "top-right");
  map.addControl(
    new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true, maximumAge: 0 },
      trackUserLocation: true,
      showUserHeading: true
    }),
    "top-right"
  );

  map.on("load", () => {
    setBasemap("map");
    addPropertyLayers();

    map.on("click", "clusters", (e) => {
      const f = map.queryRenderedFeatures(e.point, { layers: ["clusters"] });
      map.getSource("properties").getClusterExpansionZoom(f[0].properties.cluster_id, (err, zoom) => {
        if (err) return;
        map.easeTo({ center: f[0].geometry.coordinates, zoom });
      });
    });

    map.on("click", "unclustered-point", (e) => {
      const p = e.features[0].properties;
      let bodyHTML;

      if (currentPage === "development") {
        const occDisplay = p.occupancy
          ? `${((p.occupancy <= 1 ? p.occupancy * 100 : p.occupancy)).toFixed(0)}%`
          : null;
        const rows = [
          ["City", p.city],
          ["Developer", p.developerName],
          ["Development equity", p.developmentEquity ? formatCurrencyShort(p.developmentEquity) : null],
          ["Year built", p.yearBuilt],
          ["Units", p.units],
          ["Avg unit SF", p.avgUnitSF],
          ["Occupancy", occDisplay],
          ["Rent PSF", p.rentPSF ? `$${Number(p.rentPSF).toFixed(2)}` : null],
          ["Avg rent", p.avgRent ? `$${Math.round(p.avgRent).toLocaleString()}` : null]
        ]
          .map(
            ([k, v]) => `<div class="popup-row"><span class="k">${escapeHTML(k)}</span><span class="v">${escapeHTML(
              String(v || "—")
            )}</span></div>`
          )
          .join("");
        const link = p.yardiLink
          ? `<a class="popup-link" href="${escapeAttr(normalizeUrl(p.yardiLink))}" target="_blank" rel="noopener">View in Yardi →</a>`
          : "";
        bodyHTML = `<div class="popup-name">${escapeHTML(p.name || "Unnamed property")}</div>${rows}${link}`;
      } else {
        const isMultifamily = p.type === "Multifamily";
        const rows = [
          ["Address", p.address],
          ["City", p.city],
          ["Submarket", p.submarket],
          ["Owner", p.ownerName],
          ["Year built", p.yearBuilt],
          isMultifamily ? ["Units", p.units] : ["Square feet", p.squareFeet]
        ]
          .map(
            ([k, v]) => `<div class="popup-row"><span class="k">${escapeHTML(k)}</span><span class="v">${escapeHTML(
              String(v || "—")
            )}</span></div>`
          )
          .join("");
        const link = p.yardiLink
          ? `<a class="popup-link" href="${escapeAttr(normalizeUrl(p.yardiLink))}" target="_blank" rel="noopener">View in Yardi →</a>`
          : "";
        bodyHTML = `<div class="popup-name">${escapeHTML(p.name || "Unnamed property")}</div>${rows}${link}`;
      }

      new maplibregl.Popup({ offset: 10 })
        .setLngLat(e.features[0].geometry.coordinates.slice())
        .setHTML(`<div class="popup-accent"></div><div class="popup-body">${bodyHTML}</div>`)
        .addTo(map);
    });

    ["clusters", "unclustered-point"].forEach((l) => {
      map.on("mouseenter", l, () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", l, () => (map.getCanvas().style.cursor = ""));
    });

    setupFilterUI();
    setupDevFilterUI();
    setupBasemapToggle();
    mapBounds = map.getBounds();
    applyCurrentPage();

    map.on("moveend", () => {
      mapBounds = map.getBounds();
      applyCurrentPage();
    });
  });
}

// Swaps just the raster basemap layer, always keeping it beneath the property
// layers if they already exist. Never touches the properties source/layers.
function setBasemap(key) {
  if (map.getLayer("basemap-layer")) map.removeLayer("basemap-layer");
  if (map.getSource("basemap-src")) map.removeSource("basemap-src");

  const cfg = RASTER_BASEMAPS[key];
  map.addSource("basemap-src", {
    type: "raster",
    tiles: cfg.tiles,
    tileSize: 256,
    attribution: cfg.attribution
  });

  const beforeId = map.getLayer("clusters") ? "clusters" : undefined;
  map.addLayer({ id: "basemap-layer", type: "raster", source: "basemap-src" }, beforeId);
}

// Adds the properties source + layers once, on initial load only.
function addPropertyLayers() {
  map.addSource("properties", {
    type: "geojson",
    data: toGeoJSON(allProperties),
    cluster: true,
    clusterMaxZoom: 11,
    clusterRadius: 25,
    clusterProperties: {
      sum_units: ["+", ["get", "units"]]
    }
  });

  map.addLayer({
    id: "clusters",
    type: "circle",
    source: "properties",
    filter: ["has", "point_count"],
    paint: {
      "circle-color": "#4d0033",
      "circle-radius": [
        "interpolate", ["linear"], ["get", "sum_units"],
        0, 12, 200, 17, 1000, 23, 5000, 30
      ],
      "circle-stroke-width": 1,
      "circle-stroke-color": "#ffffff"
    }
  });

  map.addLayer({
    id: "cluster-count",
    type: "symbol",
    source: "properties",
    filter: ["has", "point_count"],
    layout: { "text-field": ["get", "point_count_abbreviated"], "text-font": ["Klokantech Noto Sans Bold"], "text-size": 12 },
    paint: { "text-color": "#ffffff" }
  });

  map.addLayer({
    id: "unclustered-point",
    type: "circle",
    source: "properties",
    filter: ["!", ["has", "point_count"]],
    paint: {
      "circle-color": YEAR_COLOR_EXPR,
      "circle-radius": UNIT_SIZE_EXPR,
      "circle-stroke-width": 1,
      "circle-stroke-color": "#ffffff"
    }
  });
}

function setupBasemapToggle() {
  buildSingleSelect(document.getElementById("basemap-toggle"), {
    options: [
      { value: "map", label: "Map" },
      { value: "aerial", label: "Aerial" },
      { value: "grey", label: "Grey" }
    ],
    initial: "map",
    onChange: (key) => {
      setBasemap(key);
    }
  });
}

function toGeoJSON(props) {
  return {
    type: "FeatureCollection",
    features: props.map((p) => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [p.lng, p.lat] },
      properties: {
        id: p.id,
        name: p.name || "",
        address: p.address || "",
        city: p.city || "",
        submarket: p.submarket || "",
        ownerName: p.ownerName || "",
        yearBuilt: p.yearBuilt ?? 0,
        units: p.units ?? 0,
        yardiLink: p.yardiLink || "",
        type: p.type || "",
        squareFeet: p.squareFeet ?? 0,
        developerName: p.developerName || "",
        developmentEquity: p.developmentEquity ?? 0,
        occupancy: p.occupancy ?? 0,
        rentPSF: p.rentPSF ?? 0,
        avgRent: p.avgRent ?? 0,
        avgUnitSF: p.avgUnitSF ?? 0
      }
    }))
  };
}

/* =========================================================
   FILTER UI SETUP
   ========================================================= */
function setupFilterUI() {
  msType = buildMultiSelect(document.getElementById("ms-type"), {
    placeholder: "Property type",
    getValues: () => currentFacetValues("type"),
    getSelectedInitial: () => new Set(["Multifamily"]),
    onChange: applyAll
  });
  msSubmarket = buildMultiSelect(document.getElementById("ms-submarket"), {
    placeholder: "Submarket",
    getValues: () => currentFacetValues("submarket"),
    onChange: applyAll
  });
  msCity = buildMultiSelect(document.getElementById("ms-city"), {
    placeholder: "City",
    getValues: () => currentFacetValues("city"),
    onChange: applyAll
  });
  msOwner = buildMultiSelect(document.getElementById("ms-owner"), {
    placeholder: "Owner",
    getValues: () => currentFacetValues("ownerName"),
    onChange: applyAll
  });

  msExclude = buildMultiSelect(document.getElementById("ms-exclude"), {
    placeholder: "Exclude properties",
    getValues: excludeListNames,
    getSelectedInitial: defaultExcludedNames,
    onChange: (selectedNames) => {
      excludedIds = idsForNames(selectedNames);
      applyAll();
    }
  });
  excludedIds = idsForNames(msExclude.getSelected());

  ["year-min", "year-max", "units-min", "units-max"].forEach((id) =>
    document.getElementById(id).addEventListener("input", applyAll)
  );

  document.getElementById("reset-btn").addEventListener("click", () => {
    msType.setSelected(new Set(["Multifamily"]));
    [msSubmarket, msCity, msOwner].forEach((ms) => ms.reset());
    ["year-min", "year-max", "units-min", "units-max"].forEach((id) => (document.getElementById(id).value = ""));
    msExclude.setSelected(defaultExcludedNames());
    excludedIds = idsForNames(msExclude.getSelected());
    applyAll();
  });
}

function currentFacetValues(field) {
  return [...new Set(allProperties.map((p) => p[field]).filter(Boolean))].sort();
}

function getFilterState() {
  return {
    type: msType ? msType.getSelected() : new Set(),
    submarket: msSubmarket ? msSubmarket.getSelected() : new Set(),
    city: msCity ? msCity.getSelected() : new Set(),
    owner: msOwner ? msOwner.getSelected() : new Set(),
    yearMin: numOrNull("year-min"),
    yearMax: numOrNull("year-max"),
    unitsMin: numOrNull("units-min"),
    unitsMax: numOrNull("units-max")
  };
}
function numOrNull(id) {
  const v = document.getElementById(id).value;
  return v ? parseInt(v, 10) : null;
}

function matchesFacetFilters(p, f) {
  if (f.type.size && !f.type.has(p.type)) return false;
  if (f.submarket.size && !f.submarket.has(p.submarket)) return false;
  if (f.city.size && !f.city.has(p.city)) return false;
  if (f.owner.size && !f.owner.has(p.ownerName)) return false;
  if (f.yearMin !== null && (!p.yearBuilt || p.yearBuilt < f.yearMin)) return false;
  if (f.yearMax !== null && (!p.yearBuilt || p.yearBuilt > f.yearMax)) return false;
  if (f.unitsMin !== null && (!p.units || p.units < f.unitsMin)) return false;
  if (f.unitsMax !== null && (!p.units || p.units > f.unitsMax)) return false;
  return true;
}

function currentInViewProperties() {
  const state = getFilterState();
  return allProperties.filter((p) => matchesFacetFilters(p, state));
}

// Condos / Coops (an Owner value) sorted to the top, everything else alphabetical below.
// Scoped to whatever's currently in the map's viewport, so the list stays a manageable size
// as you pan/zoom rather than listing every matching property system-wide.
function excludeListNames() {
  let props = currentInViewProperties().filter((p) => p.name);
  if (mapBounds) {
    props = props.filter((p) => mapBounds.contains([p.lng, p.lat]));
  }
  const condos = [...new Set(props.filter((p) => p.ownerName === DEFAULT_EXCLUDED_OWNER).map((p) => p.name))].sort();
  const rest = [...new Set(props.filter((p) => p.ownerName !== DEFAULT_EXCLUDED_OWNER).map((p) => p.name))].sort();
  return [...condos, ...rest];
}

function defaultExcludedNames() {
  return new Set(allProperties.filter((p) => p.ownerName === DEFAULT_EXCLUDED_OWNER && p.name).map((p) => p.name));
}

function idsForNames(names) {
  const map = nameToIdMap(allProperties);
  const ids = new Set();
  names.forEach((name) => (map[name] || []).forEach((id) => ids.add(id)));
  return ids;
}

function nameToIdMap(props) {
  const map = {};
  props.forEach((p) => {
    if (!p.name) return;
    (map[p.name] = map[p.name] || []).push(p.id);
  });
  return map;
}

/* =========================================================
   APPLY: filter map + stats + exclude list
   ========================================================= */
function currentShownProperties() {
  const state = getFilterState();
  const inView = allProperties.filter((p) => matchesFacetFilters(p, state));
  return inView.filter((p) => !excludedIds.has(p.id));
}

// Restricts a property list to whatever's currently visible in the map's viewport.
function boundedToViewport(props) {
  if (!mapBounds) return props;
  return props.filter((p) => mapBounds.contains([p.lng, p.lat]));
}

function applyAll() {
  const shown = currentShownProperties();
  map.getSource("properties").setData(toGeoJSON(shown));
  updateStats(boundedToViewport(shown));
  if (msExclude) msExclude.refresh();
  map.setPaintProperty("unclustered-point", "circle-color", YEAR_COLOR_EXPR);
}

function updateStats(filtered) {
  document.getElementById("stat-count").textContent = filtered.length.toLocaleString();
  const totalUnits = filtered.reduce((sum, p) => sum + (p.units || 0), 0);
  document.getElementById("stat-units").textContent = totalUnits.toLocaleString();

  const yearsKnown = filtered.filter((p) => p.yearBuilt);
  const avgYear = yearsKnown.length
    ? Math.round(yearsKnown.reduce((s, p) => s + p.yearBuilt, 0) / yearsKnown.length)
    : "—";
  document.getElementById("stat-year").textContent = avgYear;

  const ownerUnits = {};
  filtered.forEach((p) => {
    if (!p.ownerName || p.ownerName === "Unknown1") return;
    ownerUnits[p.ownerName] = (ownerUnits[p.ownerName] || 0) + (p.units || 0);
  });
  const topOwners = Object.entries(ownerUnits).sort((a, b) => b[1] - a[1]).slice(0, 10);
  document.getElementById("stat-owners").innerHTML = topOwners
    .map(([name, units]) => `<div class="rank-row"><span>${escapeHTML(name)}</span><span class="n">${units.toLocaleString()}</span></div>`)
    .join("");
}

function formatCurrencyShort(value) {
  const n = Number(value);
  if (isNaN(n)) return null;
  if (Math.abs(n) >= 1_000_000) return `$${(n / 1_000_000).toFixed(2)}M`;
  if (Math.abs(n) >= 1_000) return `$${(n / 1_000).toFixed(0)}K`;
  return `$${n.toFixed(0)}`;
}

/* =========================================================
   DEVELOPMENT PAGE
   ========================================================= */

// Auto-bucketing for the data-driven Rent PSF color scale (ROYGBIV, up to 7
// buckets, round-number edges) — unlike Properties' fixed year-built scheme,
// this one recomputes against whatever's currently filtered/visible.
function niceStep(roughStep) {
  if (roughStep <= 0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
  const residual = roughStep / magnitude;
  if (residual > 5) return 10 * magnitude;
  if (residual > 2) return 5 * magnitude;
  if (residual > 1) return 2 * magnitude;
  return magnitude;
}

function numericBuckets(values, maxBuckets = 7) {
  const nums = values.filter((v) => typeof v === "number" && !isNaN(v) && v > 0);
  if (!nums.length) return [];
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  if (min === max) return [{ from: min, to: max }];

  const step = niceStep((max - min) / (maxBuckets - 1));
  const niceMin = Math.floor(min / step) * step;
  const edges = [];
  for (let v = niceMin; v < max + step; v += step) edges.push(v);
  const trimmed = edges.slice(0, maxBuckets + 1);

  const buckets = [];
  for (let i = 0; i < trimmed.length - 1; i++) {
    buckets.push({ from: trimmed[i], to: trimmed[i + 1] });
  }
  return buckets;
}

function applyDevelopmentColorScheme(filtered) {
  const buckets = numericBuckets(filtered.map((p) => p.rentPSF));
  const legendEl = document.getElementById("dev-legend");

  if (!buckets.length) {
    map.setPaintProperty("unclustered-point", "circle-color", "#9aa3ab");
    legendEl.innerHTML = "";
    return;
  }

  const expr = ["step", ["coalesce", ["get", "rentPSF"], 0], RAINBOW7[0]];
  buckets.forEach((b, i) => {
    if (i === 0) return;
    expr.push(b.from, RAINBOW7[i % RAINBOW7.length]);
  });
  map.setPaintProperty("unclustered-point", "circle-color", expr);

  legendEl.innerHTML = buckets
    .map(
      (b, i) =>
        `<div class="legend-row"><span class="legend-swatch" style="background:${RAINBOW7[i % RAINBOW7.length]}"></span>$${b.from.toFixed(2)}–$${b.to.toFixed(2)}</div>`
    )
    .join("");
}

function devBasePool() {
  return allProperties.filter((p) => p.yearBuilt && p.yearBuilt >= 2010);
}

function currentDevFacetValues(field) {
  return [...new Set(devBasePool().map((p) => p[field]).filter(Boolean))].sort();
}

function matchesDevFacetFilters(p, f) {
  if (!p.yearBuilt || p.yearBuilt < 2010) return false; // hard floor: Development = 2010+
  if (f.type.size && !f.type.has(p.type)) return false;
  if (f.submarket.size && !f.submarket.has(p.submarket)) return false;
  if (f.city.size && !f.city.has(p.city)) return false;
  if (f.developer.size && !f.developer.has(p.developerName)) return false;
  if (f.yearMin !== null && p.yearBuilt < f.yearMin) return false;
  if (f.yearMax !== null && p.yearBuilt > f.yearMax) return false;
  if (f.unitsMin !== null && (!p.units || p.units < f.unitsMin)) return false;
  if (f.unitsMax !== null && (!p.units || p.units > f.unitsMax)) return false;
  return true;
}

function getDevFilterState() {
  return {
    type: msDevType ? msDevType.getSelected() : new Set(),
    submarket: msDevSubmarket ? msDevSubmarket.getSelected() : new Set(),
    city: msDevCity ? msDevCity.getSelected() : new Set(),
    developer: msDevDeveloper ? msDevDeveloper.getSelected() : new Set(),
    yearMin: numOrNull("dev-year-min"),
    yearMax: numOrNull("dev-year-max"),
    unitsMin: numOrNull("dev-units-min"),
    unitsMax: numOrNull("dev-units-max")
  };
}

function currentDevInViewProperties() {
  const state = getDevFilterState();
  return allProperties.filter((p) => matchesDevFacetFilters(p, state));
}

function devExcludeListNames() {
  let props = currentDevInViewProperties().filter((p) => p.name);
  if (mapBounds) props = props.filter((p) => mapBounds.contains([p.lng, p.lat]));
  return [...new Set(props.map((p) => p.name))].sort();
}

function currentDevShownProperties() {
  const inView = currentDevInViewProperties();
  return inView.filter((p) => !excludedIdsDev.has(p.id));
}

function setupDevFilterUI() {
  msDevType = buildMultiSelect(document.getElementById("dev-ms-type"), {
    placeholder: "Property type",
    getValues: () => currentDevFacetValues("type"),
    onChange: applyCurrentPage
  });
  msDevSubmarket = buildMultiSelect(document.getElementById("dev-ms-submarket"), {
    placeholder: "Submarket",
    getValues: () => currentDevFacetValues("submarket"),
    onChange: applyCurrentPage
  });
  msDevCity = buildMultiSelect(document.getElementById("dev-ms-city"), {
    placeholder: "City",
    getValues: () => currentDevFacetValues("city"),
    onChange: applyCurrentPage
  });
  msDevDeveloper = buildMultiSelect(document.getElementById("dev-ms-developer"), {
    placeholder: "Developer",
    getValues: () => currentDevFacetValues("developerName"),
    onChange: applyCurrentPage
  });
  msDevExclude = buildMultiSelect(document.getElementById("dev-ms-exclude"), {
    placeholder: "Exclude properties",
    getValues: devExcludeListNames,
    getSelectedInitial: () => new Set(),
    onChange: (selectedNames) => {
      excludedIdsDev = idsForNames(selectedNames);
      applyCurrentPage();
    }
  });

  ["dev-year-min", "dev-year-max", "dev-units-min", "dev-units-max"].forEach((id) =>
    document.getElementById(id).addEventListener("input", applyCurrentPage)
  );

  document.getElementById("dev-reset-btn").addEventListener("click", () => {
    [msDevType, msDevSubmarket, msDevCity, msDevDeveloper, msDevExclude].forEach((ms) => ms.reset());
    ["dev-year-min", "dev-year-max", "dev-units-min", "dev-units-max"].forEach(
      (id) => (document.getElementById(id).value = "")
    );
    excludedIdsDev = new Set();
    applyCurrentPage();
  });
}

function updateDevStats(filtered) {
  document.getElementById("dev-stat-count").textContent = filtered.length.toLocaleString();
  const totalUnits = filtered.reduce((sum, p) => sum + (p.units || 0), 0);
  document.getElementById("dev-stat-units").textContent = totalUnits.toLocaleString();

  const avgOf = (field) => {
    const known = filtered.filter((p) => p[field]);
    return known.length ? known.reduce((s, p) => s + p[field], 0) / known.length : null;
  };

  const avgSF = avgOf("avgUnitSF");
  document.getElementById("dev-stat-sf").textContent = avgSF != null ? Math.round(avgSF).toLocaleString() : "—";

  const avgRentVal = avgOf("avgRent");
  document.getElementById("dev-stat-rent").textContent =
    avgRentVal != null ? `$${Math.round(avgRentVal).toLocaleString()}` : "—";

  const avgRentPSF = avgOf("rentPSF");
  document.getElementById("dev-stat-rentpsf").textContent = avgRentPSF != null ? `$${avgRentPSF.toFixed(2)}` : "—";

  const avgOcc = avgOf("occupancy");
  document.getElementById("dev-stat-occupancy").textContent =
    avgOcc != null ? `${(avgOcc <= 1 ? avgOcc * 100 : avgOcc).toFixed(0)}%` : "—";
}

function applyDevelopmentPage() {
  const shown = currentDevShownProperties();
  map.getSource("properties").setData(toGeoJSON(shown));
  const viewportShown = boundedToViewport(shown);
  updateDevStats(viewportShown);
  applyDevelopmentColorScheme(viewportShown);
  if (msDevExclude) msDevExclude.refresh();
}

// Single entry point used by moveend, page switching, and initial load —
// dispatches to whichever page is currently active.
function applyCurrentPage() {
  if (currentPage === "development") {
    applyDevelopmentPage();
  } else {
    applyAll();
  }
}

// The basemap toggle is a single shared component (one source of truth for
// the actual active basemap) that gets physically moved into whichever page's
// panel is currently visible, right above that page's own Reset button.
function moveBasemapToggleToPage(page) {
  const toggleEl = document.getElementById("basemap-toggle");
  const anchorId = page === "development" ? "dev-reset-btn" : "reset-btn";
  const anchor = document.getElementById(anchorId);
  if (anchor) anchor.parentNode.insertBefore(toggleEl, anchor);
}

/* =========================================================
   PAGE SWITCHER
   ========================================================= */
document.getElementById("page-switcher").addEventListener("change", (e) => {
  const page = e.target.value;
  currentPage = page;

  document.getElementById("filters-properties").style.display = page === "properties" ? "block" : "none";
  document.getElementById("filters-development").style.display = page === "development" ? "block" : "none";
  document.getElementById("filters-sales").style.display = page === "sales" ? "block" : "none";

  document.getElementById("stats-properties").style.display = page === "properties" ? "block" : "none";
  document.getElementById("stats-development").style.display = page === "development" ? "block" : "none";

  moveBasemapToggleToPage(page);
  applyCurrentPage();
});
</script>
